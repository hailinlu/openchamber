# OpenChamber Rust workspace.
#
# 渐进式迁移目标 (见 docs/plan/rust-migration-plan.md):
#   - oc-server       → 替换 packages/web/server (Express → axum)
#   - oc-tauri        → 替换 packages/electron (桌面壳)
#   - oc-opencode-sdk → 替换 @opencode-ai/sdk 的服务端用法
#   - oc-core         → 跨 crate 共享类型与错误
#
# 当前为阶段 0 脚手架: 仅骨架 + 依赖链编译验证, 不含业务逻辑。

[workspace]
resolver = "2"
members = [
    "oc-core",
    "oc-opencode-sdk",
    "oc-server",
    "oc-tauri/src-tauri",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"

# 共享依赖版本集中管理, 各 crate 按 need 引用。
[workspace.dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }
# HTTP 服务器 + 客户端
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# WebSocket
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# JSONC (注释 + 尾逗号;opencode config 用)
jsonc-parser = { version = "0.33", features = ["serde"] }
# 错误处理
thiserror = "2"
anyhow = "1"
# 日志/追踪
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# CLI
clap = { version = "4", features = ["derive", "env"] }
# 编解码
base64 = "0.22"
# 密码学 (bootstrap token 哈希)
sha2 = "0.10"
# 密码学 (scrypt 密码哈希)
scrypt = "0.11"
# 密码学 (HMAC-SHA256 password binding)
hmac = "0.12"
# 密码学 (AES-256-GCM relay 帧加密, 12B IV + 16B tag)
aes-gcm = "0.10"
# 密码学 (HKDF-SHA256 relay session key 派生)
hkdf = "0.12"
# 密码学 (常量时间比较: counter 递增/fingerprint equality)
subtle = "2.6"
# JWT 签发/验证 (HS256 session token)
jsonwebtoken = "9"
# WebAuthn 服务端 (passkey 注册/认证)
webauthn-rs = "0.5"
webauthn-rs-proto = "0.5"
# ECDSA P-256 (relay 签名 + VAPID 密钥 + APNs ES256 JWT)
p256 = { version = "0.13", features = ["ecdsa", "jwk", "pkcs8"] }
# Web-push VAPID 发送 (http-ece 加密)
web-push = { version = "0.11", default-features = false, features = ["hyper-client"] }
# HTTP/2 客户端 (APNs direct 模式)
h2 = "0.4"
# pem 解析 (APNs .p8 密钥)
pem = "3"
# URL 解析 (webauthn-rs 传递依赖)
url = "2"
# 随机数
rand = "0.8"
# UUID (grant token 等)
uuid = { version = "1", features = ["v4"] }
# 时间
chrono = "0.4"
# 时区数据库 (IANA tz names; 内嵌 tzdata, 不依赖系统)
chrono-tz = "0.10"
# cron 表达式解析 + next-run 计算 (scheduled-tasks cron schedule)
cron = "0.15"
# 正则
regex = "1"
# 正则 (lookahead/lookbehind; preview body 重写需要)
fancy-regex = "0.14"
# MIME 推断
mime_guess = "2"
# 工具
once_cell = "1"
futures-util = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"
bytes = "1"
# 内部 crate
oc-core = { path = "oc-core" }
oc-opencode-sdk = { path = "oc-opencode-sdk" }
oc-server = { path = "oc-server" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
