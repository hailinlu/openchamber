[package]
name = "oc-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GridForge 桌面壳 (Tauri, 替换 packages/electron)"

[lib]
name = "oc_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
oc-core = { workspace = true }
oc-server = { workspace = true }
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
serde = { workspace = true }
serde_json = { workspace = true }
log = "0.4"
url = "2"
chrono = "0.4"

# macOS vibrancy
window-vibrancy = { version = "0.7", optional = true }

# Sidecar 进程管理: tokio (process/rt/time/net) + reqwest (/health 轮询)
tokio = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }

# Windows: Job Object 实现进程树整杀 (杀掉 opencode 孙进程)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Power",
] }

# Unix: 进程组 (setpgid + killpg) 实现进程树整杀
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["vibrancy"]
vibrancy = ["window-vibrancy"]
