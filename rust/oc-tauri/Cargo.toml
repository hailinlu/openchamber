[package]
name = "oc-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# 阶段 4 会通过 `tauri-cli` 初始化完整 Tauri 应用。
# 当前阶段 0: 仅保留 workspace 成员占位, 不引入 tauri 依赖
# (避免 tauri-cli/native 构建链在本阶段引入噪声)。

[[bin]]
name = "oc-tauri"
path = "src/main.rs"

[dependencies]
oc-core = { workspace = true }
anyhow = { workspace = true }
