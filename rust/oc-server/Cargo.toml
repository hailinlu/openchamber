[package]
name = "oc-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "oc_server"
path = "src/lib.rs"

[[bin]]
name = "oc-server"
path = "src/main.rs"

[dependencies]
oc-core = { workspace = true }
oc-opencode-sdk = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
scrypt = { workspace = true }
hmac = { workspace = true }
jsonwebtoken = { workspace = true }
# relay 模块 (E2EE 隧道)
aes-gcm = { workspace = true }
hkdf = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
	# notifications 模块 (p256 — 始终启用, 用于 relay E2EE + APNs)
	p256 = { workspace = true }
h2 = { workspace = true }
pem = { workspace = true }
serde_yaml = { workspace = true }
jsonc-parser = { workspace = true }
# url crate (webauthn-rs 传递依赖, 显式引用)
url = "2"
rand = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
cron = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }
fancy-regex = { workspace = true }
mime_guess = { workspace = true }
once_cell = { workspace = true }
futures-util = { workspace = true }
async-stream = { workspace = true }
tokio-stream = { workspace = true }
bytes = { workspace = true }
# terminal 模块: PTY (ConPTY on Windows, openpty on Unix)
portable-pty = "0.9"
# preview 模块: WebSocket 客户端 (代理到上游 dev server WS)
tokio-tungstenite = { workspace = true }

# webauthn-rs + web-push 依赖 openssl-sys, Windows MSVC 无系统 OpenSSL → 编译失败。
# 在这些依赖升级到 rustls 分支之前, 仅在非 Windows 平台启用。
# TODO(rust-migration): 换 rustls 化的库 (web-push 上游 / webauthn-rs 0.6+) 后移除此限制。
[target.'cfg(not(windows))'.dependencies]
webauthn-rs = { workspace = true }
webauthn-rs-proto = { workspace = true }
web-push = { workspace = true }

# Unix: 进程组 kill
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows: Job Object 整树杀
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# -----------------------------------------------------------------------
# Feature flags — 隔离 OpenChamber 托管服务 (源码层)
# -----------------------------------------------------------------------
# 默认全部关闭 (GridForge fork 不依赖 OpenChamber relay / 推送中继 / quota)。
# 调用方可通过 oc-server = { workspace = true, features = ["relay", ...] } 显式启用。
# 注意: feature flag 仅控制源模块 (pub mod / 路由 / state 字段) 是否参与编译,
# 不影响依赖项本身 — 否则 webauthn-rs 等公共 deps 也会被错关。
[features]
default = []
relay = []
notifications = []
quota = []