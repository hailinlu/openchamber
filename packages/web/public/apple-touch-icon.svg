<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="appleBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a3a4a" />
      <stop offset="80%" stop-color="#0e2532" />
      <stop offset="100%" stop-color="#08181f" />
    </radialGradient>
    <linearGradient id="appleCoreTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7bf2ff" />
      <stop offset="100%" stop-color="#29cce8" />
    </linearGradient>
    <linearGradient id="appleCoreLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f8ba4" />
      <stop offset="100%" stop-color="#064d5f" />
    </linearGradient>
    <linearGradient id="appleCoreRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14aac7" />
      <stop offset="100%" stop-color="#08748a" />
    </linearGradient>
    <linearGradient id="appleRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfe6ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#33e0ff" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#006685" stop-opacity="0.9" />
    </linearGradient>
    <filter id="appleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1bb9d4" flood-opacity="0.2" />
    </filter>
    <filter id="appleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="appleGlowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" rx="36" fill="url(#appleBg)" />

  <!-- Grid lines -->
  <g fill="none" stroke="#00d5ff" stroke-opacity="0.15" stroke-width="0.5">
    <circle cx="90" cy="90" r="72" stroke-dasharray="1.2 2.4" />
    <circle cx="90" cy="90" r="66" stroke-dasharray="3.6 3.6" />
    <path d="M 90 18 L 90 162 M 18 90 L 162 90" stroke-width="1" stroke-dasharray="0.3 3" />
    <path d="M 36 36 L 144 144" stroke-dasharray="6 12" />
    <path d="M 144 36 L 36 144" stroke-dasharray="6 12" />
  </g>

  <!-- 3D Isometric Core -->
  <g filter="url(#appleShadow)">
    <polygon points="90,54 126,72 90,90 54,72" fill="#042b36" />
    <polygon points="54,72 90,90 90,126 54,108" fill="#021e25" />
    <polygon points="90,90 126,72 126,108 90,126" fill="#032630" />
    <polygon points="90,63 116,76 90,88 64,76" fill="url(#appleCoreTop)" stroke="#a1f5ff" stroke-width="0.5" stroke-opacity="0.5" />
    <polygon points="64,76 90,88 90,111 64,98" fill="url(#appleCoreLeft)" />
    <polygon points="90,88 116,76 116,98 90,111" fill="url(#appleCoreRight)" />
    <polygon points="90,68 102,74 90,80 78,74" fill="#0d5869" fill-opacity="0.6" stroke="#00c3ff" stroke-width="0.3" />
    <polygon points="78,74 90,80 90,90 78,84" fill="#07323e" fill-opacity="0.8" />
    <polygon points="90,80 102,74 102,84 90,90" fill="#0a4856" fill-opacity="0.8" />
  </g>

  <!-- Orbital Rings -->
  <g filter="url(#appleShadow)">
    <ellipse cx="90" cy="90" rx="45" ry="17" fill="none" stroke="url(#appleRing)" stroke-width="2.5" stroke-dasharray="8 3 2 3" transform="rotate(-30 90 90)" />
    <ellipse cx="90" cy="90" rx="45" ry="17" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="0.8" stroke-dasharray="5 6" transform="rotate(-30 90 90)" />
    <ellipse cx="90" cy="90" rx="51" ry="18" fill="none" stroke="url(#appleRing)" stroke-width="1.5" stroke-dasharray="3 4" transform="rotate(40 90 90)" />
    <g filter="url(#appleGlow)">
      <circle cx="90" cy="51" r="1.8" fill="#d8fcff" />
      <circle cx="129" cy="78" r="1.5" fill="#19d4ff" />
      <circle cx="84" cy="135" r="2" fill="#ffffff" />
      <circle cx="51" cy="102" r="1.5" fill="#1ad4ff" />
    </g>
  </g>

  <!-- Lightning Bolt -->
  <g filter="url(#appleGlowStrong)">
    <polygon points="90,59 98,81 93,81 96,104 86,92 90,92 89,59" fill="none" stroke="#ffffff" stroke-width="1" />
  </g>
  <g filter="url(#appleGlow)">
    <polygon points="90,59 98,81 93,81 96,104 86,92 90,92 89,59" fill="#ffffff" />
    <polygon points="90,63 94,80 92,80 96,96 87,89 90,89 89,63" fill="#bbf9ff" />
  </g>

  <!-- Text -->
  <g fill="#57828f" font-family="'Montserrat','Segoe UI',sans-serif" font-weight="900" letter-spacing="3">
    <text x="90" y="159" font-size="5.5" text-anchor="middle" fill="#1cc4e0" fill-opacity="0.7">AUTOMATED GRID</text>
    <text x="90" y="167" font-size="3" text-anchor="middle" fill="#ffffff" fill-opacity="0.2" letter-spacing="1.2">HUMANLESS OPERATIONS</text>
  </g>
</svg>
