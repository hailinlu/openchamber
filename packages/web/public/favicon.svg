<svg width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="favBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d1f2d" />
      <stop offset="80%" stop-color="#050b12" />
      <stop offset="100%" stop-color="#020406" />
    </radialGradient>
    <linearGradient id="favTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7bf2ff" />
      <stop offset="100%" stop-color="#29cce8" />
    </linearGradient>
    <linearGradient id="favLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f8ba4" />
      <stop offset="100%" stop-color="#064d5f" />
    </linearGradient>
    <linearGradient id="favRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14aac7" />
      <stop offset="100%" stop-color="#08748a" />
    </linearGradient>
    <filter id="favShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <filter id="favGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="url(#favBg)" />

  <!-- 3D Isometric Core -->
  <g filter="url(#favShadow)">
    <polygon points="50,30 70,40 50,50 30,40" fill="#042b36" />
    <polygon points="30,40 50,50 50,70 30,60" fill="#021e25" />
    <polygon points="50,50 70,40 70,60 50,70" fill="#032630" />
    <polygon points="50,35 64,42 50,49 36,42" fill="url(#favTop)" stroke="#a1f5ff" stroke-width="0.5" stroke-opacity="0.5" />
    <polygon points="36,42 50,49 50,62 36,55" fill="url(#favLeft)" />
    <polygon points="50,49 64,42 64,55 50,62" fill="url(#favRight)" />
  </g>

  <!-- Lightning Bolt -->
  <g filter="url(#favGlow)">
    <polygon points="50,33 54,45 52,45 53,58 48,51 50,51 49,33" fill="#ffffff" />
    <polygon points="50,35 52,44 51,44 52,53 48,49 50,49 50,35" fill="#bbf9ff" />
  </g>
</svg>
